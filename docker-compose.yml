services:
  db:
    image: pgvector/pgvector:pg16
    container_name: yachai_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: yachai
      POSTGRES_PASSWORD: yachai
      POSTGRES_DB: yachai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yachai_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@yachai.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
